name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python verify/identities.py
      - run: pytest -q
      # `bash -n a b` would check only `a` (b becomes an argument), so check each script on its own.
      - run: |
          for f in audit/scan_lean_repo.sh audit/fetch_and_diff.sh audit/kernel-check/kernel_check.sh \
                   audit/kernel-check/fasrc.sbatch audit/kernel-check/submit_fasrc.sh; do bash -n "$f"; done
